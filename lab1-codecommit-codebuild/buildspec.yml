version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Instalando dependencias..."
      - pip install pytest

  pre_build:
    commands:
      - echo "Verificando entorno..."
      - python --version

  build:
    commands:
      - echo "Ejecutando tests..."
      - mkdir -p reports
      - cd app && python -m pytest test_app.py --junitxml=../reports/test-results.xml

  post_build:
    commands:
      - echo "Build completado exitosamente"

reports:
  pytest-reports:
    files:
      - reports/test-results.xml
    file-format: JUNITXML

artifacts:
  files:
    - "**/*"
